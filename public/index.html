<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebRTC 맛보기 · Loopback</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>WebRTC 맛보기 · Loopback</h1>
    <p class="sub">한 페이지 안의 pc1(송신) → pc2(수신). 시그널링 서버 없이 SDP를 직접 전달합니다.</p>
  </header>

  <section class="controls">
    <button id="btnStart">카메라 켜기</button>
    <button id="btnCall" disabled>연결 시작</button>
    <button id="btnHangup" disabled>종료</button>
  </section>

  <section class="videos">
    <figure>
      <figcaption>Local (pc1 송신)</figcaption>
      <video id="local" autoplay playsinline muted></video>
    </figure>
    <figure>
      <figcaption>Remote (pc2 수신)</figcaption>
      <video id="remote" autoplay playsinline></video>
    </figure>
  </section>

  <section class="status">
    상태: pc1 <b id="state1">-</b> · pc2 <b id="state2">-</b>
  </section>

  <section>
    <h2>로그</h2>
    <pre id="log"></pre>
  </section>

  <script src="main.js"></script>
</body>
</html>
