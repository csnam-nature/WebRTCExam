# coturn 설정 (로컬 실습용). turn/run-coturn.ps1 이 Docker 로 실행할 때 사용합니다.
# 실행 시 --external-ip=<이 PC의 IP> 가 추가됩니다. (Docker 컨테이너 내부 IP 대신 PC IP 를 광고해야 함)

listening-port=3478
fingerprint

# 인증: 시간제한 자격증명 (.env 의 TURN_SECRET 과 같은 값)
use-auth-secret
static-auth-secret=change-me-study-secret
realm=webrtc.study

# 릴레이 포트 범위. Docker Desktop(Windows)은 host 네트워크가 없어 포트를 하나씩 매핑하므로 좁게 잡는다.
min-port=49160
max-port=49200

# 로컬 실습이라 TLS(turns:5349)는 끈다. 공개 서버에서는 인증서를 넣고 켤 것.
# (coturn 4.18 기준: no-dtls 는 없어졌고, 관리 CLI 는 --cli 를 줄 때만 켜진다)
no-tls

log-file=stdout
verbose

# 공개 서버로 운영할 때는 사설망으로의 중계를 막아야 한다 (내부망 공격 경로 차단). 예:
# denied-peer-ip=10.0.0.0-10.255.255.255
# denied-peer-ip=172.16.0.0-172.31.255.255
# denied-peer-ip=192.168.0.0-192.168.255.255
